<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.1); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.4; }
        100% { transform: translateY(450px); opacity: 0; }
      }

      .floating-card-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatRev 9s ease-in-out infinite;
      }
      .glowing-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 10s ease-in-out infinite;
      }
      .glowing-orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseGlow 8s ease-in-out infinite 2s;
      }
      .stream-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 2s linear infinite;
      }
      .scan-beam {
        animation: scanline 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Strictly in Background) -->
  <g opacity="0.45">
    <circle class="glowing-orb-1" cx="200" cy="120" r="140" fill="#4f46e5" filter="url(#glow)" />
    <circle class="glowing-orb-2" cx="1020" cy="280" r="160" fill="#ec4899" filter="url(#glow)" />
    <circle cx="600" cy="210" r="110" fill="#8b5cf6" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Ambient Flow Lines in Background -->
  <g opacity="0.25">
    <path class="stream-line" d="M -50 140 Q 300 60, 600 150 T 1250 120" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="stream-line" d="M -50 280 Q 350 360, 700 270 T 1250 310" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Floating Dynamic Tech Decorative Cards (Side Elements) -->
  <!-- Left Side Dynamic Element: Extraction Card -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="50" y="70" width="220" height="110" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="75" cy="95" r="5" fill="#22c55e" />
    <text x="90" y="99" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">AI EXTRACTION</text>
    <rect x="75" y="115" width="130" height="6" rx="3" fill="#334155" />
    <rect x="75" y="130" width="170" height="6" rx="3" fill="#38bdf8" fill-opacity="0.7" />
    <rect x="75" y="145" width="100" height="6" rx="3" fill="#6366f1" fill-opacity="0.8" />
  </g>

  <!-- Left Side Lower Dynamic Element: Obligation Tracker -->
  <g class="floating-card-2" opacity="0.75">
    <rect x="60" y="240" width="210" height="90" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
    <circle cx="85" cy="265" r="5" fill="#eab308" />
    <text x="100" y="269" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">OBLIGATION TRACKER</text>
    <path d="M 85 295 L 125 285 L 165 305 L 205 280 L 245 290" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side Dynamic Element: Citation Graph / MCP -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="930" y="65" width="220" height="120" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="955" cy="90" r="5" fill="#38bdf8" />
    <text x="970" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CITATION GRAPH</text>
    <!-- Diagram nodes -->
    <circle cx="975" cy="135" r="10" fill="#4f46e5" />
    <line x1="985" y1="135" x2="1035" y2="120" stroke="#64748b" stroke-width="1.5" />
    <circle cx="1045" cy="120" r="12" fill="#8b5cf6" />
    <line x1="1057" y1="120" x2="1105" y2="145" stroke="#64748b" stroke-width="1.5" />
    <circle cx="1115" cy="145" r="9" fill="#ec4899" />
  </g>

  <!-- Right Side Lower Dynamic Element: Audit & Compliance -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="940" y="235" width="200" height="95" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
    <circle cx="965" cy="260" r="5" fill="#a855f7" />
    <text x="980" y="264" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">VERIFIED EVIDENCE</text>
    <rect x="965" y="280" width="145" height="18" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="975" y="293" fill="#a5b4fc" font-family="monospace" font-size="10">99.8% Grounded</text>
  </g>

  <!-- Subtle Scanning Laser Line -->
  <line class="scan-beam" x1="100" y1="0" x2="1100" y2="0" stroke="#a855f7" stroke-width="1.5" opacity="0.3" filter="url(#glow)" />

  <!-- CENTER FOREGROUND CONTENT (ALWAYS CRISP & UNCLUTTERED) -->
  <g id="foreground-content">
    <!-- Top Category Badge Pill -->
    <g transform="translate(600, 78)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="-145" cy="0" r="4" fill="#10b981" />
      <text x="-132" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE CLM &amp; LEGAL AI</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Contract Intelligence Platform
    </text>

    <!-- Subtitle Gradient Accent -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif" font-size="21" font-weight="700" fill="url(#primaryGrad)" letter-spacing="0.2">
      Clause Extraction • Obligation Tracking • Legal Reasoning
    </text>

    <!-- Tagline Description -->
    <text x="600" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Curated ecosystem of enterprise SaaS suites and self-hosted open-source CLM frameworks
    </text>

    <!-- Feature Attribute Pills -->
    <g transform="translate(600, 310)">
      <!-- Pill 1 -->
      <g transform="translate(-255, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="4.5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⚡ AI Redlining</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-85, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="4.5" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🎯 Hybrid Retrieval</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(85, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="4.5" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🛡️ Data Sovereignty</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(255, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="0" y="4.5" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⚖️ Citation Graphs</text>
      </g>
    </g>

    <!-- Decorative Subtle Border Frame on Inside -->
    <rect x="15" y="15" width="1170" height="390" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.3" />
  </g>
</svg>
